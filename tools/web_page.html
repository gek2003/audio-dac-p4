<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>DAC remote</title><style>body{background:#14181c;color:#e8e6e3;font-family:sans-serif;max-width:640px;margin:0 auto;padding:16px}h1{font-size:20px;margin:8px 0}#st{color:#9aa4ad;font-size:13px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;margin:10px 0}button{background:#3a4148;color:#e8e6e3;border:0;border-radius:8px;padding:14px 10px;font-size:18px;flex:1;cursor:pointer}button:active{background:#4a525a}input[type=text]{flex:4;padding:10px;background:#1d2227;color:#e8e6e3;border:1px solid #3a4148;border-radius:8px;min-width:0}#bar{height:28px;background:#1d2227;border-radius:8px;position:relative;overflow:hidden;cursor:pointer}#fill{height:100%;background:#4a7ba6;width:0}#tm{position:absolute;top:4px;left:8px;font-size:12px}input[type=range]{flex:3;min-width:0}li{padding:10px 6px;border-bottom:1px solid #232a30;cursor:pointer;word-break:break-all}ul{list-style:none;padding:0;margin:8px 0}.lbl{color:#9aa4ad;font-size:13px;margin-top:16px}.dim{color:#5a646c}</style></head><body><h1>DAC remote</h1><div id='st' class='dim'>...</div><div id='bar'><div id='fill'></div><div id='tm'></div></div><div class='row'><button onclick="volrel(-5)">&minus;</button><input type='range' id='vl' min='0' max='100' value='80'><button onclick="volrel(5)">+</button><button id='mu' onclick="api('/api/mute')">M</button></div><div class='row'><button onclick="api('/api/prev').then(tick)">|&lt;</button><button id='pp' onclick="api('/api/play').then(tick)">&gt;</button><button onclick="api('/api/next').then(tick)">&gt;|</button></div><div class='row'><input type='text' id='url' placeholder='http://... radio or file'><button onclick="playUrl()">GO</button></div><div class='lbl'>SD / USB / Phono</div><div class='row'><button id='btsd' onclick='setRoot("sd")'>SD</button><button id='btusb' onclick='setRoot("usb")'>USB</button><button onclick="api('/api/phono').then(tick)">PHONO</button></div><ul id='fl'></ul><div class='lbl'>Phono subsonic HPF</div><div class='row'><button id='hp0' onclick="api('/api/hpf?v=0').then(tick)">OFF</button><button id='hp1' onclick="api('/api/hpf?v=1').then(tick)">GENTLE</button><button id='hp2' onclick="api('/api/hpf?v=2').then(tick)">STRICT</button></div><div class='lbl'>DSD mode</div><div class='row'><button id='dsd0' onclick="api('/api/dsd?v=0').then(tick)">DoP</button><button id='dsd1' onclick="api('/api/dsd?v=1').then(tick)">Native</button></div><div class='dim' id='dsdhint'>Native: нужна проводка DATA2/DATA_CLK (GPIO49/50); применяется со следующего DSD-трека</div><div class='lbl'>Radio stations</div><ul id='stl'></ul><div class='lbl'>Firmware</div><div class='row'><input type='text' id='otaurl' placeholder='http://... firmware.bin'><button onclick='otaFromUrl()'>URL</button><button onclick='otaFromSd()'>SD</button></div><div id='otast' class='dim'></div><script>let scrubbing=false,stations=[],curPath='',curOff=0;const $=id=>document.getElementById(id);$('vl').addEventListener('input',()=>{scrubbing=true});$('vl').addEventListener('change',()=>{scrubbing=false;tick()});let busy=false,lastApi=0;function api(u){if(busy||Date.now()-lastApi<300)return Promise.resolve({err:'busy'});busy=true;lastApi=Date.now();return fetch(u,{method:'POST'}).then(r=>r.json()).finally(()=>{busy=false})}function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}function tm(ms){const s=Math.floor(ms/1000);const m=Math.floor(s/60)%60,sec=s%60,h=Math.floor(s/3600);return (h?h+':':'')+Math.floor(s/60)+':'+String(sec).padStart(2,'0')}function volrel(d){const v=$('vl');api('/api/volume?v='+Math.max(0,Math.min(100,+v.value+d))).then(tick)}function playUrl(){const u=$('url').value.trim();if(!u)return;api('/api/src?u='+encodeURIComponent(u)).then(tick)}$('vl').addEventListener('change',()=>api('/api/volume?v='+$('vl').value));$('bar').addEventListener('click',e=>{const r=$('bar').getBoundingClientRect();fetch('/api/status').then(r=>r.json()).then(j=>{if(!j.seekable||!j.total_ms)return;const k=(e.clientX-r.left)/r.width;api('/api/seek?ms='+Math.floor(k*j.total_ms)).then(tick)})})function tick(){fetch('/api/status').then(r=>r.json()).then(j=>{const st=j.state=='playing'?'PLAYING':j.state=='paused'?'PAUSED':'STOPPED';$('st').textContent=st+' | '+j.ip+' | '+j.ssid+' | '+j.vol_db+' dB'+(j.mute?' [MUTE]':'')+' | fs='+(j.fs||'-');$('pp').innerHTML=j.state=='playing'?'II':'&gt;';if(!scrubbing){$('vl').value=j.vol_pct;$('fill').style.width=(j.total_ms?100*j.pos_ms/j.total_ms:0)+'%';$('tm').textContent=j.total_ms?tm(j.pos_ms)+' / '+tm(j.total_ms):'';const hpf=(typeof j.hpf==='number')?j.hpf:1;$('hp0').style.background=hpf==0?'#4a7ba6':'#3a4148';$('hp1').style.background=hpf==1?'#4a7ba6':'#3a4148';$('hp2').style.background=hpf==2?'#4a7ba6':'#3a4148';const dsdm=(typeof j.dsd==='number')?j.dsd:0;$('dsd0').style.background=dsdm==0?'#4a7ba6':'#3a4148';$('dsd1').style.background=dsdm==1?'#4a7ba6':'#3a4148';}})}setInterval(tick,2000);tick();let curRoot='sd';function setRoot(r){curRoot=r;$('btsd').style.background=r=='sd'?'#4a7ba6':'#3a4148';$('btusb').style.background=r=='usb'?'#4a7ba6':'#3a4148';loadFiles('',0,false)}function loadFiles(p,off,append){curPath=p;curOff=off;fetch('/api/files?root='+curRoot+(p?'&path='+encodeURIComponent(p):'')+'&off='+off+'&lim=100').then(r=>r.json()).then(j=>{const el=$('fl');if(!append){el.innerHTML='';}if(j.err){el.innerHTML="<li class='dim'>"+j.err+'</li>';return}if(!append&&p){const li=document.createElement('li');li.textContent='.. (up)';li.onclick=()=>{const i=p.lastIndexOf('/');loadFiles(i>0?p.slice(0,i):'',0,false)};el.appendChild(li)}if(!j.items||!j.items.length){if(!append)el.innerHTML+="<li class='dim'>empty</li>";return}j.items.forEach(it=>{const li=document.createElement('li');li.textContent=(it.dir?'[DIR] ':'')+it.name;const full=p?(p.endsWith('/')?p:p+'/'+it.name):it.name;li.onclick=()=>it.dir?loadFiles(full,0,false):api('/api/playfile?p='+encodeURIComponent(full)+'&root='+curRoot).then(()=>{});el.appendChild(li)})const got=off+j.items.length;if(j.count>got){const li=document.createElement('li');li.className='dim';li.textContent='... ещё '+(j.count-got);li.onclick=()=>loadFiles(curPath,got,true);el.appendChild(li)}})}setRoot('sd');function loadStations(){fetch('/api/stations').then(r=>r.json()).then(j=>{stations=j.items||[];const el=$('stl');el.innerHTML='';if(!stations.length){el.innerHTML="<li class='dim'>empty</li>";return}stations.forEach((it,idx)=>{const li=document.createElement('li');li.textContent=it.name;li.onclick=()=>fetch('/api/station?i='+idx,{method:'POST'}).then(tick);el.appendChild(li)})})}loadStations();function otaFromUrl(){const u=$('otaurl').value.trim();if(!u)return;api('/api/ota?u='+encodeURIComponent(u)).then(j=>{$('otast').textContent=j.err?j.err+' '+j.msg:'started';tick()})}function otaFromSd(){api('/api/ota?file=firmware.bin').then(j=>{$('otast').textContent=j.err?j.err+' '+j.msg:'started (firmware.bin)';tick()})}function otaTick(){fetch('/api/status').then(r=>r.json()).then(j=>{const o=j.ota||{};$('otast').textContent=o.state=='idle'?'':(o.state+' '+(o.pct>=0?o.pct+'% ':'')+(o.msg||''))});}setInterval(otaTick,2000);otaTick();</script></body></html>
